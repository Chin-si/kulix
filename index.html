<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kulix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans antialiased pb-24">

  <div id="auth-screen" class="flex flex-col items-center justify-center min-h-screen px-4">
    <div class="bg-zinc-900 p-8 rounded-2xl w-full max-w-md border border-zinc-800 shadow-2xl">
      <h1 class="text-5xl font-black text-center mb-2 tracking-wider text-indigo-500 uppercase">Kulix</h1>
      <p class="text-zinc-400 text-center text-sm mb-6 font-medium">Claim Your Username</p>
      
      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-zinc-400 mb-1">Username</label>
          <input type="text" id="username-input" required placeholder="e.g., skater_alex" minlength="3" maxlength="15" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-indigo-500 transition-colors">
          <p class="text-[10px] text-zinc-500 mt-2">⚠️ Your account will be permanently locked to this specific device.</p>
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/20 active:scale-[0.98]">
          Enter Hub
        </button>
      </form>
    </div>
  </div>

  <div id="app-screen" class="hidden max-w-2xl mx-auto px-4 pt-6">
    <header class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-3xl font-black text-indigo-400 tracking-wide uppercase">Kulix</h1>
        <p id="user-display" class="text-xs text-zinc-400 font-bold tracking-wide"></p>
      </div>
      <div class="text-xs text-zinc-600 font-medium">Teens Only</div>
    </header>

    <div id="tab-feed" class="tab-content space-y-6">
      <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 shadow-md">
        <form id="post-form" class="space-y-3">
          <textarea id="post-content" required placeholder="What's going down?" rows="3" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
          <input type="url" id="post-image" placeholder="Image URL (optional)" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-zinc-100 placeholder-zinc-500 text-xs focus:outline-none focus:border-indigo-500">
          <div class="flex justify-end">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2 rounded-xl font-bold text-sm transition-all shadow-md">
              Share Update
            </button>
          </div>
        </form>
      </div>
      <div id="feed-container" class="space-y-4"></div>
    </div>

    <div id="tab-polls" class="tab-content hidden space-y-6">
      <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 shadow-md">
        <h3 class="text-sm font-bold text-zinc-400 mb-3 uppercase tracking-wider">Create a Poll</h3>
        <form id="poll-form" class="space-y-3">
          <input type="text" id="poll-question" required placeholder="Where are we hanging out tonight?" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500">
          <input type="text" id="poll-options" required placeholder="Comma separated choices (e.g., Mall, Beach, Park)" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-xs text-zinc-100 focus:outline-none focus:border-indigo-500">
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded-xl font-bold text-sm transition-colors">
            Launch Poll
          </button>
        </form>
      </div>
      <div id="polls-container" class="space-y-4"></div>
    </div>

    <div id="tab-bucket" class="tab-content hidden space-y-6">
      <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 shadow-md">
        <h3 class="text-sm font-bold text-zinc-400 mb-3 uppercase tracking-wider">Add Group Goal / Event</h3>
        <form id="bucket-form" class="flex flex-col sm:flex-row gap-2">
          <input type="text" id="bucket-title" required placeholder="Road Trip / Alex's Birthday" class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
          <input type="date" id="bucket-date" required class="bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-zinc-400 focus:outline-none focus:border-indigo-500">
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl font-bold text-sm transition-colors whitespace-nowrap">
            Add Event
          </button>
        </form>
      </div>
      <div id="bucket-container" class="space-y-4"></div>
    </div>
  </div>

  <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 bg-zinc-900 border-t border-zinc-800 py-3 px-6 flex justify-around items-center z-50">
    <button onclick="switchTab('feed')" id="nav-feed" class="flex flex-col items-center gap-1 text-indigo-500 font-bold text-xs transition-colors">
      <span>💬</span><span>Feed</span>
    </button>
    <button onclick="switchTab('polls')" id="nav-polls" class="flex flex-col items-center gap-1 text-zinc-400 font-medium text-xs transition-colors">
      <span>📊</span><span>Polls</span>
    </button>
    <button onclick="switchTab('bucket')" id="nav-bucket" class="flex flex-col items-center gap-1 text-zinc-400 font-medium text-xs transition-colors">
      <span>⏳</span><span>Countdowns</span>
    </button>
  </nav>

  <script>
    // ⚠️ TO DO: PASTE YOUR UNIQUE SUPABASE KEYS RIGHT HERE
    const SUPABASE_URL = "https://vmjcaccyphhmirxnoipv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_9ajwIGyWEUZfRxwtsdHD6g__Xi2hvwg";

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUsername = "";
    let activeTab = "feed";

    // App Navigation & Screens
    const authScreen = document.getElementById('auth-screen');
    const appScreen = document.getElementById('app-screen');
    const bottomNav = document.getElementById('bottom-nav');
    const authForm = document.getElementById('auth-form');
    const userDisplay = document.getElementById('user-display');

    // Generate or fetch a secure internal hardware key signature for this phone
    function getDeviceToken() {
      let token = localStorage.getItem('kulix_device_signature');
      if (!token) {
        token = 'kx_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
        localStorage.setItem('kulix_device_signature', token);
      }
      return token;
    }

    async function initSession() {
      const token = getDeviceToken();
      
      // Look up if this phone signature already has an assigned username
      const { data: user, error } = await supabase
        .from('kulix_users')
        .select('*')
        .eq('device_token', token)
        .maybeSingle();

      if (user) {
        currentUsername = user.username;
        launchApp();
      } else {
        authScreen.classList.remove('hidden');
      }
    }

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const inputName = document.getElementById('username-input').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
      const token = getDeviceToken();

      if(inputName.length < 3) {
        alert("Username must be at least 3 characters.");
        return;
      }

      // Check if username is already claimed by someone else
      const { data: existingUser } = await supabase.from('kulix_users').select('*').eq('username', inputName).maybeSingle();
      
      if (existingUser) {
        alert("This username is already claimed by another device!");
        return;
      }

      // Double check this phone hasn't secretly registered an account already via a different method
      const { data: tokenCheck } = await supabase.from('kulix_users').select('*').eq('device_token', token).maybeSingle();
      if (tokenCheck) {
        alert(`Device lock warning: This device is already registered under the account "@${tokenCheck.username}"! Returning you to your profile.`);
        currentUsername = tokenCheck.username;
        launchApp();
        return;
      }

      // Everything checks out! Save the new profile
      const { error: insertError } = await supabase.from('kulix_users').insert([{ username: inputName, device_token: token }]);
      
      if (insertError) {
        alert("Registration failed. Try a different username.");
      } else {
        currentUsername = inputName;
        launchApp();
      }
    });

    function launchApp() {
      userDisplay.innerText = `@${currentUsername}`;
      authScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
      bottomNav.classList.remove('hidden');
      
      // Live syncing streams
      supabase.channel('global-sync').on('postgres_changes', { event: '*', schema: 'public' }, () => {
        if (activeTab === 'feed') fetchFeed();
        if (activeTab === 'polls') fetchPolls();
        if (activeTab === 'bucket') fetchBucketList();
      }).subscribe();

      switchTab('feed');
    }

    function switchTab(tabId) {
      activeTab = tabId;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      
      ['feed', 'polls', 'bucket'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (t === tabId) {
          btn.classList.replace('text-zinc-400', 'text-indigo-500');
          btn.classList.replace('font-medium', 'font-bold');
        } else {
          btn.classList.replace('text-indigo-500', 'text-zinc-400');
          btn.classList.replace('font-bold', 'font-medium');
        }
      });

      if(tabId === 'feed') fetchFeed();
      if(tabId === 'polls') fetchPolls();
      if(tabId === 'bucket') fetchBucketList();
    }

    // ================= FEED MODULE =================
    document.getElementById('post-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = document.getElementById('post-content').value.trim();
      const image_url = document.getElementById('post-image').value.trim();
      
      await supabase.from('posts').insert([{ username: currentUsername, content, image_url }]);
      document.getElementById('post-form').reset();
      fetchFeed();
    });

    async function fetchFeed() {
      const { data: posts } = await supabase.from('posts').select('*, likes(*), comments(*)').order('created_at', { ascending: false });
      const container = document.getElementById('feed-container');
      if (!container) return; container.innerHTML = '';

      if (!posts || posts.length === 0) {
        container.innerHTML = `<p class="text-zinc-500 text-center py-8 text-xs">No updates from the crew yet.</p>`;
        return;
      }

      posts.forEach(post => {
        const hasLiked = post.likes && post.likes.some(l => l.username === currentUsername);
        const imgTag = post.image_url ? `<img src="${escapeHTML(post.image_url)}" class="rounded-xl max-h-72 w-full object-cover my-2 border border-zinc-800" onerror="this.style.display='none'" />` : '';
        const commentsHTML = post.comments ? post.comments.map(c => `
          <div class="text-[11px] bg-zinc-950 p-2 rounded-lg border border-zinc-900/50"><span class="font-bold text-indigo-400">@${escapeHTML(c.username)}:</span> ${escapeHTML(c.content)}</div>
        `).join('') : '';

        const card = document.createElement('div');
        card.className = "bg-zinc-900 p-4 rounded-2xl border border-zinc-800 space-y-2 shadow-sm";
        card.innerHTML = `
          <div class="flex justify-between items-center text-xs text-zinc-500">
            <span class="font-bold text-zinc-300">@${escapeHTML(post.username)}</span>
            <span>${new Date(post.created_at).toLocaleDateString()}</span>
          </div>
          <p class="text-sm text-zinc-100 whitespace-pre-wrap">${escapeHTML(post.content)}</p>
          ${imgTag}
          <div class="flex items-center gap-4 py-1 text-xs">
            <button onclick="toggleLike('${post.id}', ${hasLiked})" class="${hasLiked ? 'text-pink-500 font-bold' : 'text-zinc-400'} flex items-center gap-1">
              ❤️ <span>${post.likes ? post.likes.length : 0}</span>
            </button>
          </div>
          <div class="space-y-1.5 pt-2 border-t border-zinc-950">${commentsHTML}</div>
          <form onsubmit="addComment(event, '${post.id}')" class="flex gap-2 mt-2">
            <input type="text" placeholder="Reply..." required class="flex-1 bg-zinc-950 border border-zinc-800 rounded-lg text-xs px-2 py-1.5 focus:outline-none text-zinc-100">
            <button class="bg-indigo-600 text-white text-xs px-3 py-1 rounded-lg font-bold">Send</button>
          </form>
        `;
        container.appendChild(card);
      });
    }

    async function toggleLike(postId, hasLiked) {
      if (hasLiked) {
        await supabase.from('likes').delete().eq('post_id', postId).eq('username', currentUsername);
      } else {
        await supabase.from('likes').insert([{ post_id: postId, username: currentUsername }]);
      }
      fetchFeed();
    }

    async function addComment(e, postId) {
      e.preventDefault();
      const input = e.target.querySelector('input');
      const text = input.value.trim();
      if(!text) return;
      await supabase.from('comments').insert([{ post_id: postId, username: currentUsername, content: text }]);
      input.value = '';
      fetchFeed();
    }

    // ================= POLL MODULE =================
    document.getElementById('poll-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = document.getElementById('poll-question').value.trim();
      const optionsArr = document.getElementById('poll-options').value.split(',').map(o => o.trim()).filter(o => o.length > 0);
      const initialVotes = {};
      optionsArr.forEach(opt => initialVotes[opt] = 0);

      await supabase.from('polls').insert([{ question, options: optionsArr, votes: initialVotes }]);
      document.getElementById('poll-form').reset();
      fetchPolls();
    });

    async function fetchPolls() {
      const { data: polls } = await supabase.from('polls').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('polls-container');
      if (!container) return; container.innerHTML = '';

      if (!polls || polls.length === 0) {
        container.innerHTML = `<p class="text-zinc-500 text-center py-8 text-xs">No custom decisions yet.</p>`;
        return;
      }

      polls.forEach(poll => {
        let totalVotes = Object.values(poll.votes).reduce((a, b) => a + b, 0) || 0;
        let displayTotal = totalVotes === 0 ? 1 : totalVotes;

        const optionsHTML = poll.options.map(opt => {
          const count = poll.votes[opt] || 0;
          const percentage = Math.round((count / displayTotal) * 100);
          return `
            <button onclick="votePoll('${poll.id}', '${escapeQuotes(opt)}')" class="w-full text-left bg-zinc-950 hover:bg-zinc-900 border border-zinc-800 rounded-xl relative overflow-hidden p-3 mb-1.5">
              <div class="bg-indigo-600/20 absolute top-0 left-0 bottom-0 timeline-bar" style="width: ${percentage}%"></div>
              <div class="relative flex justify-between text-xs font-bold">
                <span>${escapeHTML(opt)}</span>
                <span class="text-indigo-400">${count} votes (${percentage}%)</span>
              </div>
            </button>
          `;
        }).join('');

        const card = document.createElement('div');
        card.className = "bg-zinc-900 p-4 rounded-2xl border border-zinc-800 shadow-sm";
        card.innerHTML = `<h3 class="text-sm font-bold text-zinc-100 mb-2">${escapeHTML(poll.question)}</h3><div>${optionsHTML}</div>`;
        container.appendChild(card);
      });
    }

    async function votePoll(pollId, selectedOption) {
      const { data: poll } = await supabase.from('polls').select('*').eq('id', pollId).single();
      if(!poll) return;
      const updatedVotes = { ...poll.votes };
      updatedVotes[selectedOption] = (updatedVotes[selectedOption] || 0) + 1;
      await supabase.from('polls').update({ votes: updatedVotes }).eq('id', pollId);
      fetchPolls();
    }

    // ================= COUNTDOWN MODULE =================
    document.getElementById('bucket-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('bucket-title').value.trim();
      const target_date = document.getElementById('bucket-date').value;
      await supabase.from('bucket_list').insert([{ title, target_date }]);
      document.getElementById('bucket-form').reset();
      fetchBucketList();
    });

    async function fetchBucketList() {
      const { data: events } = await supabase.from('bucket_list').select('*').order('target_date', { ascending: true });
      const container = document.getElementById('bucket-container');
      if (!container) return; container.innerHTML = '';

      if (!events || events.length === 0) {
        container.innerHTML = `<p class="text-zinc-500 text-center py-8 text-xs">No milestones created yet.</p>`;
        return;
      }

      events.forEach(ev => {
        const target = new Date(ev.target_date + 'T00:00:00');
        const today = new Date(); today.setHours(0,0,0,0);
        const daysLeft = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        let countdownText = daysLeft > 0 ? `⏳ ${daysLeft} days left` : daysLeft === 0 ? "🎉 TODAY!" : "✅ Completed";

        const card = document.createElement('div');
        card.className = `bg-zinc-900 p-4 rounded-2xl border ${ev.is_completed ? 'border-emerald-900/40 opacity-60' : 'border-zinc-800'} flex justify-between items-center`;
        card.innerHTML = `
          <div>
            <h4 class="text-sm font-bold ${ev.is_completed ? 'line-through text-zinc-500' : 'text-zinc-100'}">${escapeHTML(ev.title)}</h4>
            <p class="text-[11px] font-medium text-zinc-400 mt-0.5">${countdownText}</p>
          </div>
          <button onclick="toggleBucketComplete('${ev.id}', ${ev.is_completed})" class="text-xs bg-zinc-950 border border-zinc-800 px-3 py-1.5 rounded-xl font-bold">
            ${ev.is_completed ? 'Reset' : 'Done'}
          </button>
        `;
        container.appendChild(card);
      });
    }

    async function toggleBucketComplete(id, currentStatus) {
      await supabase.from('bucket_list').update({ is_completed: !currentStatus }).eq('id', id);
      fetchBucketList();
    }

    function escapeHTML(str) {
      if(!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
    function escapeQuotes(str) {
      if(!str) return '';
      return str.replace(/'/g, "\\'");
    }

    // Fire it up
    initSession();
  </script>
</body>
</html>
