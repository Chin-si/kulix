<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080812">
  <meta name="description" content="SEEN — You don't need followers to be heard.">
  <title>SEEN — Zambia</title>
 <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () {
      (window.vaq = window.vaq || []).push(arguments);
    };
  </script>

  <script
    defer
    src="/_vercel/insights/script.js">
  </script>
   

  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#080812;--panel:#111121;--panel2:#17172b;--text:#f7f7fb;--muted:#9292aa;--line:#282842;--accent:#8b5cf6;--accent2:#ec4899;--good:#34d399;--danger:#fb7185;--max:760px}
    *{box-sizing:border-box}html{background:var(--bg);color-scheme:dark}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 20% 0%,#17132e 0,#080812 38%);color:var(--text);min-height:100vh}
    button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{max-width:var(--max);margin:auto;padding:14px 14px 90px}
    .top{position:sticky;top:0;z-index:20;background:rgba(8,8,18,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06);padding:10px 0;margin-bottom:12px}
    .topin{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;letter-spacing:.22em;font-size:20px}.tag{font-size:11px;color:var(--muted);margin-top:2px}
    .pill{border:1px solid var(--line);background:#101022;border-radius:999px;padding:7px 10px;color:#bcbcdf;font-size:12px}
    .hero{padding:22px 4px 12px}.hero h1{font-size:clamp(34px,9vw,58px);line-height:.95;margin:0 0 12px;letter-spacing:-.05em}.hero p{color:#b8b8c9;line-height:1.5;margin:0;max-width:560px}
    .card{background:linear-gradient(145deg,rgba(23,23,43,.96),rgba(13,13,27,.96));border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 14px 45px rgba(0,0,0,.18)}
    .btn{border:1px solid var(--line);background:#18182b;color:var(--text);border-radius:14px;padding:12px 14px;font-weight:800;transition:.15s}.btn:hover{transform:translateY(-1px);border-color:#494967}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0}.wide{width:100%}
    .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.vibe{padding:12px 6px;border-radius:15px;border:1px solid var(--line);background:#111123;text-align:center;color:#ddd;font-size:12px}.vibe.active{border-color:var(--accent);background:#211a3b;box-shadow:0 0 0 1px var(--accent) inset}
    .emoji{display:block;font-size:22px;margin-bottom:5px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.input,.textarea{width:100%;background:#0d0d1a;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px;outline:0}.textarea{min-height:110px;resize:vertical}.input:focus,.textarea:focus{border-color:#6250a4}
    .row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.muted{color:var(--muted)}.tiny{font-size:11px}.count{text-align:right;color:var(--muted);font-size:11px;margin-top:5px}
    .posthead{display:flex;justify-content:space-between;gap:12px}.name{font-weight:850}.meta{color:var(--muted);font-size:12px;margin-top:2px}.vibeTag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:#c7bfff}
    .postbody{font-size:17px;line-height:1.55;margin:14px 0;white-space:pre-wrap;overflow-wrap:anywhere}.postimg{width:100%;max-height:420px;object-fit:cover;border-radius:15px;border:1px solid var(--line);margin-top:6px}.audio{width:100%;margin-top:8px}.seenline{color:#a9a9bd;font-size:12px;margin-bottom:10px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.action{padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:#101021;color:#ddd;font-size:12px}.action.selected{border-color:var(--accent);background:#211a3b}
    .reply{border-top:1px solid #24243a;padding:10px 0}.reply:last-child{border-bottom:0}.reply p{margin:5px 0 0;color:#d5d5df;line-height:1.45;font-size:14px}
    .bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(8,8,18,.94);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.08)}.bottomin{max-width:var(--max);margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px 10px calc(7px + env(safe-area-inset-bottom))}.nav{border:0;background:transparent;color:#8f8fa7;padding:8px 3px;font-size:11px}.nav strong{display:block;font-size:18px;margin-bottom:2px}.nav.active{color:#fff}
    .toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#222238;border:1px solid #41415e;padding:11px 14px;border-radius:13px;font-size:13px;z-index:100;max-width:90%;text-align:center}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:grid;place-items:center;padding:18px}.modalbox{width:min(520px,100%);max-height:90vh;overflow:auto;background:#101020;border:1px solid var(--line);border-radius:22px;padding:18px}.close{float:right;border:0;background:transparent;color:#aaa;font-size:24px}
    .empty{text-align:center;padding:40px 16px;color:var(--muted)}.notice{padding:11px 13px;border-radius:13px;background:#15152a;border:1px solid #292944;color:#bdbdd0;font-size:12px;line-height:1.5}
    .profileStat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#0e0e1c;border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{font-size:22px;display:block}.stat span{color:var(--muted);font-size:11px}
    @media(max-width:520px){.grid{grid-template-columns:repeat(5,1fr)}.vibe{padding:9px 2px}.actions{grid-template-columns:1fr 1fr}.actions .action:last-child{grid-column:1/-1}}
  </style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>

<script>
(() => {
  "use strict";

  // =========================
  // 1) PUT YOUR SUPABASE KEYS HERE
  // =========================
 const SUPABASE_URL =
  "https://jfzypvnlbrmpbuxmlhgp.supabase.co";


const SUPABASE_ANON_KEY =
  "sb_publishable_uT8ky5GdL-0LQ3O5cJlJZw_EfP6IHCM";
  
  const configured = !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_ANON_KEY.includes("YOUR_SUPABASE");
  const sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  const VIBES = {
    hype:["🔥","Hype"], crush:["❤️","Crush"], heartbreak:["💔","Heartbreak"],
    healing:["🌱","Healing"], stressed:["🧠","Stressed"]
  };

  let state = {
    session:null, profile:null, tab:"home", posts:[], replies:{}, reactions:{},
    selectedVibe:null, loading:false, feedLimit:10
  };

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const timeAgo = d => {
    const sec = Math.max(1, (Date.now()-new Date(d).getTime())/1000);
    if(sec<60) return `${Math.floor(sec)}s`;
    if(sec<3600) return `${Math.floor(sec/60)}m`;
    if(sec<86400) return `${Math.floor(sec/3600)}h`;
    return `${Math.floor(sec/86400)}d`;
  };
  function toast(msg){ $("toast").textContent=msg; $("toast").classList.remove("hidden"); setTimeout(()=>$("toast").classList.add("hidden"),2600); }
  function modal(html){ $("modalBox").innerHTML=html; $("modal").classList.remove("hidden"); }
  function closeModal(){ $("modal").classList.add("hidden"); }
  $("modal").addEventListener("click", e=>{if(e.target.id==="modal") closeModal();});

  function localProfile(){ try{return JSON.parse(localStorage.getItem("seen_profile")||"null")}catch{return null} }
  function saveLocal(p){ localStorage.setItem("seen_profile",JSON.stringify(p)); }

  async function boot(){
    render();
    if(!configured){
      toast("Demo mode: add your Supabase URL + anon key to connect the database.");
      return;
    }
    try{
      let {data:{session}} = await sb.auth.getSession();
      if(!session){
        const r = await sb.auth.signInAnonymously();
        if(r.error) throw r.error;
        session = r.data.session;
      }
      state.session=session;
      const {data:profile} = await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
      state.profile = profile || localProfile();
      render();
      if(state.profile) await loadFeed();
      sb.channel("seen-live").on("postgres_changes",{event:"*",schema:"public",table:"posts"},()=>loadFeed(false)).subscribe();
    }catch(err){
      console.error(err); toast("Could not connect to SEEN. Check your Supabase setup.");
    }
  }

  function render(){
    if(!state.profile){ renderWelcome(); return; }
    $("app").innerHTML = `
      <div class="app">
        <header class="top"><div class="topin">
          <div><div class="brand">SEEN</div><div class="tag">You don't need followers to be heard.</div></div>
          <button class="pill" onclick="openProfile()">👤 ${esc(state.profile.nickname)}</button>
        </div></header>
        <main id="main">${state.tab==="home"?homeView():state.tab==="rooms"?roomsView():state.tab==="create"?createView():profileView()}</main>
      </div>
      <nav class="bottom"><div class="bottomin">
        <button class="nav ${state.tab==="home"?"active":""}" onclick="go('home')"><strong>👀</strong>SEEN</button>
        <button class="nav ${state.tab==="rooms"?"active":""}" onclick="go('rooms')"><strong>🌎</strong>ROOMS</button>
        <button class="nav ${state.tab==="create"?"active":""}" onclick="go('create')"><strong>＋</strong>SAY IT</button>
        <button class="nav ${state.tab==="profile"?"active":""}" onclick="go('profile')"><strong>⚙</strong>ME</button>
      </div></nav>`;
  }

  function renderWelcome(){
    $("app").innerHTML = `
      <div class="app">
        <section class="hero">
          <div class="brand">SEEN</div>
          <h1>You don't need followers to be heard.</h1>
          <p>No likes. No clout. No endless scrolling. Just people who actually see you.</p>
        </section>
        <div class="card">
          <div class="notice">SEEN V2 is designed for young people in Zambia. Keep your profile private, don't share exact locations, and report/block anything unsafe.</div>
          <div class="field"><label>YOUR NICKNAME</label><input id="nickname" class="input" maxlength="24" placeholder="e.g. Kay"></div>
          <div class="field"><label>YOUR VIBE</label><div class="grid" id="vibes">${Object.entries(VIBES).map(([k,v])=>`<button class="vibe" data-vibe="${k}" onclick="pickVibe('${k}')"><span class="emoji">${v[0]}</span>${v[1]}</button>`).join("")}</div></div>
          <label class="row tiny" style="margin:12px 0;color:#bbb"><input id="ageok" type="checkbox"> I am 14–19 and agree to use SEEN respectfully.</label>
          <button class="btn primary wide" onclick="join()">ENTER SEEN →</button>
          ${!configured?'<p class="tiny muted" style="margin-top:12px">Demo mode is active until you add your Supabase credentials in this file.</p>':''}
        </div>
      </div>`;
  }

  window.pickVibe = k => {
    state.selectedVibe=k;
    document.querySelectorAll(".vibe").forEach(x=>x.classList.toggle("active",x.dataset.vibe===k));
  };

  async function join(){
    const nickname=$("nickname")?.value.trim();
    if(!nickname) return toast("Choose a nickname first.");
    if(!state.selectedVibe) return toast("Choose your vibe.");
    if(!$("ageok")?.checked) return toast("SEEN V1 is for ages 14–19.");
    if(!configured){
      state.profile={id:"demo",nickname,vibe:state.selectedVibe,about:"",created_at:new Date().toISOString()};
      saveLocal(state.profile); render(); return;
    }
    try{
      if(!state.session){
        const r=await sb.auth.signInAnonymously();
        if(r.error) throw r.error;
        state.session=r.data.session;
      }
      const p={id:state.session.user.id,nickname,vibe:state.selectedVibe,about:""};
      const {data,error}=await sb.from("profiles").upsert(p).select().single();
      if(error) throw error;
      state.profile=data; saveLocal(data); render(); await loadFeed();
    }catch(e){console.error(e);toast(e.message||"Could not create profile.");}
  }

  function homeView(){
    const vibeButtons=Object.entries(VIBES).map(([k,v])=>`<button class="vibe ${state.selectedVibe===k?"active":""}" onclick="filterVibe('${k}')"><span class="emoji">${v[0]}</span>${v[1]}</button>`).join("");
    return `<section class="hero"><h1>RIGHT NOW.</h1><p>Small posts. Real replies. Take your time.</p></section>
      <div class="card"><div class="row between"><b>FILTER BY VIBE</b><button class="pill" onclick="filterVibe(null)">All</button></div><div class="grid" style="margin-top:10px">${vibeButtons}</div></div>
      <div id="feed">${state.loading?'<div class="empty">Loading SEEN…</div>':feedHTML()}</div>`;
  }

  function feedHTML(){
    if(!state.posts.length) return `<div class="card empty"><div style="font-size:36px">👀</div><b>No posts yet.</b><p>Be the first person to say something real.</p><button class="btn primary" onclick="go('create')">SAY SOMETHING</button></div>`;
    return state.posts.slice(0,state.feedLimit).map(postHTML).join("")+
      (state.posts.length>state.feedLimit?`<button class="btn wide" onclick="state.feedLimit+=10;render()">LOAD 10 MORE</button>`:"");
  }

  function postHTML(p){
    const r=state.reactions[p.id]||null;
    const v=VIBES[p.vibe]||["•","Vibe"];
    return `<article class="card" id="post-${p.id}">
      <div class="posthead"><div><div class="name">${esc(p.profile?.nickname||"Someone")}</div><div class="meta">🇿🇲 Zambia · ${timeAgo(p.created_at)}</div></div><span class="vibeTag">${v[0]} ${v[1]}</span></div>
      <div class="postbody">${esc(p.body)}</div>
      ${p.image_url?`<img class="postimg" loading="lazy" src="${esc(p.image_url)}" alt="Post image">`:""}
      ${p.audio_url?`<audio class="audio" controls preload="none" src="${esc(p.audio_url)}"></audio>`:""}
      <div class="seenline">👀 ${p.seen_count||0} people have seen this</div>
      <div class="actions">
        <button class="action ${r==="seen"?"selected":""}" onclick="react('${p.id}','seen')">👀 I SEE YOU</button>
        <button class="action ${r==="same"?"selected":""}" onclick="react('${p.id}','same')">🤝 SAME</button>
        <button class="action" onclick="replyBox('${p.id}')">💬 REPLY</button>
      </div>
      <div id="replies-${p.id}">${replyHTML(p.id)}</div>
      <button class="tiny" style="margin-top:9px;background:none;border:0;color:#777" onclick="reportPost('${p.id}')">Report / Block</button>
    </article>`;
  }

  function replyHTML(id){
    const rs=state.replies[id]||[];
    if(!rs.length)return "";
    return rs.slice(0,3).map(x=>`<div class="reply"><div class="tiny muted"><b>${esc(x.profile?.nickname||"Someone")}</b> · ${timeAgo(x.created_at)}</div><p>${esc(x.body)}</p></div>`).join("");
  }

  async function loadFeed(show=true){
    if(!configured){ state.posts=[]; render(); return; }
    if(show){state.loading=true;render();}
    try{
      let q=sb.from("posts").select("*,profile:profiles!posts_author_id_fkey(nickname,vibe)").eq("status","active").order("created_at",{ascending:false}).limit(50);
      if(state.selectedVibe) q=q.eq("vibe",state.selectedVibe);
      const {data,error}=await q;
      if(error) throw error;
      state.posts=data||[];
      const ids=state.posts.map(p=>p.id);
      if(ids.length){
        const {data:rr}=await sb.from("reactions").select("post_id,reaction").eq("user_id",state.session.user.id).in("post_id",ids);
        state.reactions={}; (rr||[]).forEach(x=>state.reactions[x.post_id]=x.reaction);
        const {data:rep}=await sb.from("replies").select("*,profile:profiles!replies_author_id_fkey(nickname)").in("post_id",ids).order("created_at",{ascending:true});
        state.replies={}; (rep||[]).forEach(x=>(state.replies[x.post_id]??=[]).push(x));
      }
    }catch(e){console.error(e);toast("Could not load the feed.");}
    state.loading=false;render();
  }

  window.filterVibe = async k => {state.selectedVibe=k;state.feedLimit=10;await loadFeed();};

  window.react = async (postId,reaction) => {
    if(!configured) return toast("Connect Supabase to save reactions.");
    try{
      const {error}=await sb.from("reactions").upsert({post_id:postId,user_id:state.session.user.id,reaction},{onConflict:"post_id,user_id"});
      if(error) throw error;
      const {error:e2}=await sb.rpc("record_reaction",{p_post_id:postId,p_user_id:state.session.user.id,p_reaction:reaction});
      // RPC may be unavailable if SQL wasn't run; the upsert is still valid.
      if(e2) console.warn(e2);
      state.reactions[postId]=reaction; render();
    }catch(e){toast(e.message||"Reaction failed.");}
  };

  window.replyBox = id => {
    modal(`<button class="close" onclick="closeModal()">×</button><h2>Reply to this person</h2><p class="muted">Keep it respectful. Real people are on the other side.</p>
      <textarea id="replyText" class="textarea" maxlength="280" placeholder="Say something helpful…"></textarea>
      <div class="count"><span id="replyCount">0</span>/280</div>
      <button class="btn primary wide" onclick="sendReply('${id}')">SEND REPLY</button>`);
    setTimeout(()=>{const t=$("replyText");t?.addEventListener("input",()=>$("replyCount").textContent=t.value.length)},0);
  };

  window.sendReply = async id => {
    const body=$("replyText")?.value.trim(); if(!body)return toast("Write a reply first.");
    if(!configured)return toast("Connect Supabase to save replies.");
    try{
      const {error}=await sb.from("replies").insert({post_id:id,author_id:state.session.user.id,body});
      if(error) throw error;
      closeModal(); toast("Reply sent 👀"); await loadFeed(false);
    }catch(e){toast(e.message||"Could not send reply.");}
  };

  function createView(){
    return `<section class="hero"><h1>SAY IT.</h1><p>You don't have to sound perfect. Just be real.</p></section>
      <div class="card">
        <div class="field"><label>WHAT'S ON YOUR MIND?</label><textarea id="postBody" class="textarea" maxlength="280" placeholder="Say something real…"></textarea><div class="count"><span id="postCount">0</span>/280</div></div>
        <div class="field"><label>VIBE</label><div class="grid">${Object.entries(VIBES).map(([k,v])=>`<button class="vibe ${state.selectedVibe===k?"active":""}" onclick="pickVibe('${k}')"><span class="emoji">${v[0]}</span>${v[1]}</button>`).join("")}</div></div>
        <div class="notice">V1 keeps media optional. Images should be small and voice notes should be 15 seconds or less. Never share your exact address, school location, phone number or private information.</div>
        <div class="field"><label>OPTIONAL PHOTO</label><input id="imageFile" class="input" type="file" accept="image/*"></div>
        <div class="field"><label>OPTIONAL VOICE (MAX 15 SEC)</label><input id="audioFile" class="input" type="file" accept="audio/*"></div>
        <button class="btn primary wide" onclick="createPost()">POST TO SEEN 👀</button>
      </div>
      <script>setTimeout(()=>{const t=document.getElementById('postBody');t?.addEventListener('input',()=>document.getElementById('postCount').textContent=t.value.length)},0)<\/script>`;
  }

  async function uploadFile(file,folder){
    if(!file)return null;
    const max=folder==="images"?100*1024:2*1024*1024;
    if(file.size>max) throw new Error(folder==="images"?"Photo must be under 100KB.":"Audio file is too large.");
    const ext=(file.name.split(".").pop()||"bin").replace(/[^a-z0-9]/gi,"").toLowerCase();
    const path=`${state.session.user.id}/${crypto.randomUUID()}.${ext}`;
    const {error}=await sb.storage.from(folder).upload(path,file,{upsert:false,contentType:file.type});
    if(error)throw error;
    const {data}=sb.storage.from(folder).getPublicUrl(path);
    return data.publicUrl;
  }

  window.createPost = async () => {
    const body=$("postBody")?.value.trim(); if(!body)return toast("Write something first.");
    if(!state.selectedVibe)return toast("Choose a vibe.");
    if(!configured)return toast("Connect Supabase to publish.");
    const img=$("imageFile")?.files?.[0], aud=$("audioFile")?.files?.[0];
    try{
      if(img && img.size>100*1024) throw new Error("Photo must be under 100KB.");
      if(aud && aud.size>2*1024*1024) throw new Error("Voice file is too large.");
      let image_url=null,audio_url=null;
      if(img) image_url=await uploadFile(img,"images");
      if(aud) audio_url=await uploadFile(aud,"audio");
      const {error}=await sb.from("posts").insert({author_id:state.session.user.id,body,vibe:state.selectedVibe,image_url,audio_url});
      if(error)throw error;
      toast("You're SEEN 👀"); state.tab="home"; await loadFeed();
    }catch(e){console.error(e);toast(e.message||"Could not publish.");}
  };

  function roomsView(){
    return `<section class="hero"><h1>VIBE ROOMS.</h1><p>Small spaces. No follower counts. Join the feeling.</p></section>
      ${Object.entries(VIBES).map(([k,v])=>`<div class="card row between"><div><div style="font-size:25px">${v[0]}</div><b>${v[1]}</b><div class="tiny muted">Text + short replies · temporary room</div></div><button class="btn" onclick="joinRoom('${k}')">ENTER →</button></div>`).join("")}
      <div class="notice">Rooms are intentionally simple in V1. Don't share private contact details or arrange unsafe meetups.</div>`;
  }

  window.joinRoom = k => {
    const v=VIBES[k];
    modal(`<button class="close" onclick="closeModal()">×</button><h2>${v[0]} ${v[1]}</h2><div class="notice">Room chat is the next backend module. For this V1 build, use the ${esc(v[1])} filter on the SEEN feed to keep the community small and focused.</div><button class="btn primary wide" style="margin-top:12px" onclick="closeModal();filterVibe('${k}')">VIEW ${v[1].toUpperCase()} POSTS</button>`);
  };

  function profileView(){
    return `<section class="hero"><h1>ME.</h1><p>Your profile stays simple. No followers. No likes.</p></section>
      <div class="card"><div class="row between"><div><div style="font-size:24px">👤</div><h2 style="margin:5px 0">${esc(state.profile.nickname)}</h2><div class="muted">🇿🇲 Zambia · ${VIBES[state.profile.vibe]?.[0]||"•"} ${VIBES[state.profile.vibe]?.[1]||"Vibe"}</div></div><button class="btn" onclick="editProfile()">EDIT</button></div></div>
      <div class="card profileStat"><div class="stat"><b>${state.posts.filter(x=>x.author_id===state.profile.id).length}</b><span>POSTS IN CURRENT FEED</span></div><div class="stat"><b>0</b><span>FOLLOWERS — intentionally</span></div></div>
      <div class="card"><h3>SAFETY</h3><p class="muted tiny">Block/report users who make you uncomfortable. Never share your exact location, school address, phone number, passwords or private photos.</p><button class="btn wide" onclick="toast('Safety center: report + block tools are available on posts.')">OPEN SAFETY CENTER</button></div>`;
  }

  window.editProfile = () => {
    modal(`<button class="close" onclick="closeModal()">×</button><h2>Edit profile</h2><div class="field"><label>NICKNAME</label><input id="editNick" class="input" maxlength="24" value="${esc(state.profile.nickname)}"></div><div class="field"><label>ABOUT (OPTIONAL)</label><input id="editAbout" class="input" maxlength="80" value="${esc(state.profile.about||"")}"></div><button class="btn primary wide" onclick="saveProfile()">SAVE</button>`);
  };

  window.saveProfile = async()=>{
    const nickname=$("editNick").value.trim(); const about=$("editAbout").value.trim();
    if(!nickname)return toast("Nickname can't be empty.");
    if(!configured)return toast("Connect Supabase to save.");
    const {data,error}=await sb.from("profiles").update({nickname,about}).eq("id",state.profile.id).select().single();
    if(error)return toast(error.message); state.profile=data; saveLocal(data); closeModal();render();
  };

  window.reportPost = id => {
    modal(`<button class="close" onclick="closeModal()">×</button><h2>Report this post</h2><p class="muted">Choose a reason. Reports help keep SEEN safe.</p>
      ${["Bullying / harassment","Sexual or unsafe content","Spam / scam","Threats","Something else"].map(r=>`<button class="btn wide" style="margin:5px 0;text-align:left" onclick="submitReport('${id}',${JSON.stringify(r)})">${esc(r)}</button>`).join("")}
      <button class="tiny" style="margin-top:12px;background:none;border:0;color:#aaa" onclick="closeModal()">Cancel</button>`);
  };

  window.submitReport = async(id,reason)=>{
    if(!configured)return toast("Connect Supabase to submit reports.");
    const {error}=await sb.from("reports").insert({reporter_id:state.session.user.id,post_id:id,reason});
    if(error)return toast(error.message); closeModal(); toast("Report received. Thank you.");
  };

  window.openProfile=()=>{state.tab="profile";render()};
  window.go=t=>{state.tab=t;render(); if(t==="home")loadFeed(false)};

  // Basic local demo fallback so the UI can be tested before Supabase.
  if(!configured){
    const demoPosts=[
      {id:"d1",author_id:"demo2",profile:{nickname:"Kay"},vibe:"hype",body:"I finally started making music. Lowkey scared nobody will listen 😭",seen_count:7,created_at:new Date(Date.now()-3600000).toISOString()},
      {id:"d2",author_id:"demo3",profile:{nickname:"Sky"},vibe:"heartbreak",body:"Sometimes you miss the old version of someone more than the person they are now.",seen_count:12,created_at:new Date(Date.now()-7200000).toISOString()},
      {id:"d3",author_id:"demo4",profile:{nickname:"Melo"},vibe:"stressed",body:"School pressure is actually crazy. Just trying to keep going.",seen_count:4,created_at:new Date(Date.now()-9000000).toISOString()}
    ];
    state.posts=demoPosts;
  }

  boot();
})();
</script>
</body>
</html>
