<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kulix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans antialiased pb-24">

  <div id="auth-screen" class="flex flex-col items-center justify-center min-h-screen px-4">
    <div class="bg-zinc-900 p-8 rounded-2xl w-full max-w-md border border-zinc-800 shadow-2xl">
      <h1 class="text-5xl font-black text-center mb-2 tracking-wider text-indigo-500 uppercase">Kulix</h1>
      <p class="text-zinc-400 text-center text-sm mb-6 font-medium">Teens Only Hub</p>
      
      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-zinc-400 mb-1 tracking-wider">Choose a Nickname</label>
          <input type="text" id="input-nickname" maxlength="25" required placeholder="e.g., skate_pro" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-100 focus:outline-none focus:border-indigo-500 transition-colors">
        </div>
        
        <div id="auth-error" class="hidden text-red-400 font-medium text-xs border border-red-900/50 bg-red-950/20 p-2.5 rounded-xl"></div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/20 active:scale-[0.98]">
          Enter Space
        </button>
      </form>
    </div>
  </div>

  <div id="app-screen" class="hidden max-w-2xl mx-auto px-4 pt-6">
    <header class="flex justify-between items-center mb-6 bg-zinc-900/50 p-4 border border-zinc-800 rounded-2xl">
      <div class="flex items-center space-x-3">
        <img id="user-avatar" src="" alt="Identity Token" class="w-10 h-10 rounded-xl border border-indigo-500 bg-zinc-950" />
        <div>
          <h1 class="text-2xl font-black text-indigo-400 tracking-wide uppercase leading-none mb-1">Kulix</h1>
          <p id="user-display" class="text-xs text-zinc-400 font-bold tracking-tight"></p>
        </div>
      </div>
      <button id="logout-btn" class="text-xs bg-zinc-950 hover:bg-zinc-900 px-3 py-2 rounded-xl border border-zinc-800 font-semibold transition-colors text-zinc-400 hover:text-zinc-200">
        Exit Hub
      </button>
    </header>

    <div id="tab-feed" class="tab-content space-y-6">
      <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 shadow-md">
        <form id="post-form" class="space-y-3">
          <textarea id="post-content" required placeholder="What's going down?" rows="3" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
          <input type="url" id="post-image" placeholder="Image URL (optional)" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-zinc-100 placeholder-zinc-500 text-xs focus:outline-none focus:border-indigo-500">
          <div class="flex justify-end">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2 rounded-xl font-bold text-sm transition-all shadow-md">
              Share Update
            </button>
          </div>
        </form>
      </div>
      <div id="feed-container" class="space-y-4"></div>
    </div>

    <div id="tab-polls" class="tab-content hidden space-y-6">
      <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 shadow-md">
        <h3 class="text-sm font-bold text-zinc-400 mb-3 uppercase tracking-wider">Create a Poll</h3>
        <form id="poll-form" class="space-y-3">
          <input type="text" id="poll-question" required placeholder="Where are we hanging out tonight?" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500">
          <input type="text" id="poll-options" required placeholder="Comma separated choices (e.g., Mall, Beach, Park)" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-xs text-zinc-100 focus:outline-none focus:border-indigo-500">
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded-xl font-bold text-sm transition-colors">
            Launch Poll
          </button>
        </form>
      </div>
      <div id="polls-container" class="space-y-4"></div>
    </div>

    <div id="tab-bucket" class="tab-content hidden space-y-6">
      <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 shadow-md">
        <h3 class="text-sm font-bold text-zinc-400 mb-3 uppercase tracking-wider">Add Group Goal / Event</h3>
        <form id="bucket-form" class="flex flex-col sm:flex-row gap-2">
          <input type="text" id="bucket-title" required placeholder="Road Trip / Alex's Birthday" class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
          <input type="date" id="bucket-date" required class="bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-zinc-400 focus:outline-none focus:border-indigo-500">
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl font-bold text-sm transition-colors whitespace-nowrap">
            Add Event
          </button>
        </form>
      </div>
      <div id="bucket-container" class="space-y-4"></div>
    </div>
  </div>

  <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 bg-zinc-900 border-t border-zinc-800 py-3 px-6 flex justify-around items-center z-50">
    <button onclick="switchTab('feed')" id="nav-feed" class="flex flex-col items-center gap-1 text-indigo-500 font-bold text-xs transition-colors">
      <span>💬</span><span>Feed</span>
    </button>
    <button onclick="switchTab('polls')" id="nav-polls" class="flex flex-col items-center gap-1 text-zinc-400 font-medium text-xs transition-colors">
      <span>📊</span><span>Polls</span>
    </button>
    <button onclick="switchTab('bucket')" id="nav-bucket" class="flex flex-col items-center gap-1 text-zinc-400 font-medium text-xs transition-colors">
      <span>⏳</span><span>Countdowns</span>
    </button>
  </nav>

  <script>

   // ⚠️ TO DO: PASTE YOUR UNIQUE SUPABASE KEYS RIGHT HERE
    const SUPABASE_URL = "https://vmjcaccyphhmirxnoipv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_9ajwIGyWEUZfRxwtsdHD6g__Xi2hvwg";

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;

    const authScreen = document.getElementById('auth-screen');
    const appScreen = document.getElementById('app-screen');
    const bottomNav = document.getElementById('bottom-nav');
    const authForm = document.getElementById('auth-form');
    const authError = document.getElementById('auth-error');
    const userDisplay = document.getElementById('user-display');

    window.addEventListener('DOMContentLoaded', () => {
      const savedSession = localStorage.getItem('kulix_registered_user');
      if (savedSession) {
        currentUser = JSON.parse(savedSession);
        renderAppSpace();
      }
    });

    function renderAppSpace() {
      authScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
      bottomNav.classList.remove('hidden');
      
      document.getElementById('user-avatar').src = currentUser.avatar_url;
      userDisplay.innerText = `@${currentUser.nickname}`;
      switchTab('feed');
    }

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.classList.add('hidden');
      authError.innerText = '';

      const rawNickname = document.getElementById('input-nickname').value.trim();
      
      if (rawNickname.includes(' ') || rawNickname.includes('@')) {
        authError.innerText = 'Nicknames cannot contain spaces or "@" marks.';
        authError.classList.remove('hidden');
        return;
      }

      const { data: searchUser } = await supabase.from('users').select('*').eq('nickname', rawNickname).maybeSingle();
      
      if (searchUser) {
        currentUser = searchUser;
        localStorage.setItem('kulix_registered_user', JSON.stringify(searchUser));
        renderAppSpace();
      } else {
        const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(rawNickname)}`;
        
        const { data: newUser, error } = await supabase
          .from('users')
          .insert([{ nickname: rawNickname, avatar_url: avatarUrl }])
          .select().single();

        if (error) {
          authError.innerText = 'Could not register nickname. Try another one.';
          authError.classList.remove('hidden');
          return;
        }

        currentUser = newUser;
        localStorage.setItem('kulix_registered_user', JSON.stringify(newUser));
        renderAppSpace();
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('kulix_registered_user');
      location.reload();
    });

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      
      ['feed', 'polls', 'bucket'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (t === tabId) {
          btn.classList.replace('text-zinc-400', 'text-indigo-500');
          btn.classList.replace('font-medium', 'font-bold');
        } else {
          btn.classList.replace('text-indigo-500', 'text-zinc-400');
          btn.classList.replace('font-bold', 'font-medium');
        }
      });

      if(tabId === 'feed') fetchFeed();
      if(tabId === 'polls') fetchPolls();
      if(tabId === 'bucket') fetchBucketList();
    }

    // ================= MODULE 1: ATOMIC FEED TRACKER =================
    document.getElementById('post-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = document.getElementById('post-content').value.trim();
      const image_url = document.getElementById('post-image').value.trim();
      
      await supabase.from('posts').insert([{ user_id: currentUser.id, nickname: currentUser.nickname, content, image_url }]);
      document.getElementById('post-form').reset();
      fetchFeed();
    });

    async function fetchFeed() {
      const { data: posts } = await supabase.from('posts').select('*, likes(*), comments(*)').order('created_at', { ascending: false });
      const container = document.getElementById('feed-container');
      container.innerHTML = '';

      const safePosts = posts || [];
      if(safePosts.length === 0) {
        container.innerHTML = `<p class="text-zinc-600 text-center text-xs py-8 font-mono">No updates shared on the wall yet.</p>`;
        return;
      }

      safePosts.forEach(post => {
        const safeLikes = post.likes || [];
        const safeComments = post.comments || [];
        const hasLiked = safeLikes.some(l => l.user_id === currentUser.id);
        const imgTag = post.image_url ? `<img src="${escapeHTML(post.image_url)}" class="rounded-xl max-h-72 w-full object-cover my-2 border border-zinc-800" />` : '';
        
        const commentsHTML = safeComments.map(c => `
          <div class="text-xs bg-zinc-950 p-2 rounded-lg border border-zinc-900"><span class="font-bold text-indigo-400">@${escapeHTML(c.nickname)}:</span> ${escapeHTML(c.content)}</div>
        `).join('');

        const card = document.createElement('div');
        card.className = "bg-zinc-900 p-4 rounded-2xl border border-zinc-800 space-y-2 shadow-sm";
        card.innerHTML = `
          <div class="flex justify-between items-center text-xs text-zinc-500">
            <span class="font-bold text-zinc-300">@${escapeHTML(post.nickname)}</span>
            <span>${new Date(post.created_at).toLocaleDateString()}</span>
          </div>
          <p class="text-sm text-zinc-100 whitespace-pre-wrap break-words">${escapeHTML(post.content)}</p>
          ${imgTag}
          <div class="flex items-center gap-4 py-1 text-xs">
            <button class="like-toggle-btn ${hasLiked ? 'text-pink-500 font-bold' : 'text-zinc-400'} flex items-center gap-1">
              ❤️ <span>${safeLikes.length}</span>
            </button>
          </div>
          <div class="space-y-1.5 pt-2 border-t border-zinc-950">${commentsHTML}</div>
          <form class="comment-submission-form flex gap-2 mt-2">
            <input type="text" placeholder="Write a comment..." required class="flex-1 bg-zinc-950 border border-zinc-800 rounded-lg text-xs px-2 py-1.5 focus:outline-none text-zinc-100">
            <button class="bg-indigo-600 text-white text-xs px-3 py-1 rounded-lg font-bold">Post</button>
          </form>
        `;

        // Direct Event Attachment Layer to prevent single/double quote string crashes
        card.querySelector('.like-toggle-btn').addEventListener('click', () => toggleLike(post.id, hasLiked));
        card.querySelector('.comment-submission-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const input = e.target.querySelector('input');
          addComment(post.id, input.value.trim());
          input.value = '';
        });

        container.appendChild(card);
      });
    }

    async function toggleLike(postId, hasLiked) {
      if (hasLiked) {
        await supabase.from('likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
      } else {
        await supabase.from('likes').insert([{ post_id: postId, user_id: currentUser.id, nickname: currentUser.nickname }]);
      }
      fetchFeed();
    }

    async function addComment(postId, commentText) {
      if(!commentText) return;
      await supabase.from('comments').insert([{ post_id: postId, user_id: currentUser.id, nickname: currentUser.nickname, content: commentText }]);
      fetchFeed();
    }

    // ================= MODULE 2: ATOMIC SURVEYS / POLLS =================
    document.getElementById('poll-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = document.getElementById('poll-question').value.trim();
      const optionsArr = document.getElementById('poll-options').value.split(',').map(o => o.trim());
      
      const initialVotes = {};
      optionsArr.forEach(opt => initialVotes[opt] = 0);

      await supabase.from('polls').insert([{ question, options: optionsArr, votes: initialVotes }]);
      document.getElementById('poll-form').reset();
      fetchPolls();
    });

    async function fetchPolls() {
      const { data: polls } = await supabase.from('polls').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('polls-container');
      container.innerHTML = '';

      const safePolls = polls || [];
      if(safePolls.length === 0) {
        container.innerHTML = `<p class="text-zinc-600 text-center text-xs py-8 font-mono">No surveys launched yet.</p>`;
        return;
      }

      safePolls.forEach(poll => {
        const votesObj = poll.votes || {};
        let totalVotes = Object.values(votesObj).reduce((a, b) => a + b, 0) || 1;

        const card = document.createElement('div');
        card.className = "bg-zinc-900 p-4 rounded-2xl border border-zinc-800 space-y-3";
        card.innerHTML = `<h3 class="text-sm font-bold text-zinc-100">${escapeHTML(poll.question)}</h3><div class="poll-options-box space-y-2"></div>`;
        
        const optionsBox = card.querySelector('.poll-options-box');

        (poll.options || []).forEach(opt => {
          const count = votesObj[opt] || 0;
          const percentage = Math.round((count / totalVotes) * 100);

          const optBtn = document.createElement('button');
          optBtn.className = "w-full text-left bg-zinc-950 hover:bg-zinc-900 border border-zinc-800 rounded-xl relative overflow-hidden p-3 transition-all active:scale-[0.99]";
          optBtn.innerHTML = `
            <div class="bg-indigo-600/20 absolute top-0 left-0 bottom-0 transition-all duration-500" style="width: ${percentage}%"></div>
            <div class="relative flex justify-between text-xs font-bold">
              <span>${escapeHTML(opt)}</span>
              <span class="text-indigo-400">${count} votes (${percentage}%)</span>
            </div>
          `;
          
          // Secure Event Handler Binding without string-injection pitfalls
          optBtn.addEventListener('click', () => votePoll(poll.id, opt));
          optionsBox.appendChild(optBtn);
        });

        container.appendChild(card);
      });
    }

    async function votePoll(pollId, selectedOption) {
      const { data: poll } = await supabase.from('polls').select('*').eq('id', pollId).single();
      if (!poll) return;
      const updatedVotes = { ...(poll.votes || {}) };
      updatedVotes[selectedOption] = (updatedVotes[selectedOption] || 0) + 1;
      
      await supabase.from('polls').update({ votes: updatedVotes }).eq('id', pollId);
      fetchPolls();
    }

    // ================= MODULE 3: TARGET TRACKERS =================
    document.getElementById('bucket-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('bucket-title').value.trim();
      const target_date = document.getElementById('bucket-date').value;
      
      await supabase.from('bucket_list').insert([{ title, target_date }]);
      document.getElementById('bucket-form').reset();
      fetchBucketList();
    });

    async function fetchBucketList() {
      const { data: events } = await supabase.from('bucket_list').select('*').order('target_date', { ascending: true });
      const container = document.getElementById('bucket-container');
      container.innerHTML = '';

      const safeEvents = events || [];
      if(safeEvents.length === 0) {
        container.innerHTML = `<p class="text-zinc-600 text-center text-xs py-8 font-mono">No upcoming target logs recorded.</p>`;
        return;
      }

      safeEvents.forEach(ev => {
        const timeDiff = new Date(ev.target_date) - new Date();
        const daysLeft = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));
        let countdownText = daysLeft > 0 ? `⏳ ${daysLeft} days left` : daysLeft === 0 ? "🎉 HAPPENING TODAY!" : "✅ Completed / Past Event";
        
        const card = document.createElement('div');
        card.className = `bg-zinc-900 p-4 rounded-2xl border ${ev.is_completed ? 'border-emerald-900/40 opacity-60' : 'border-zinc-800'} flex justify-between items-center shadow-sm`;
        card.innerHTML = `
          <div>
            <h4 class="text-sm font-bold ${ev.is_completed ? 'line-through text-zinc-500' : 'text-zinc-100'}">${escapeHTML(ev.title)}</h4>
            <p class="text-[11px] font-medium text-zinc-400 mt-0.5">${countdownText}</p>
          </div>
          <button class="status-toggle-action text-sm bg-zinc-950 p-2 rounded-xl border border-zinc-800 font-semibold">
            ${ev.is_completed ? '🔄 Undo' : '✅ Done'}
          </button>
        `;

        card.querySelector('.status-toggle-action').addEventListener('click', () => toggleBucketComplete(ev.id, ev.is_completed));
        container.appendChild(card);
      });
    }

    async function toggleBucketComplete(id, currentStatus) {
      await supabase.from('bucket_list').update({ is_completed: !currentStatus }).eq('id', id);
      fetchBucketList();
    }

    // Safety Sanitization Utility
    function escapeHTML(str) {
      if(!str) return '';
      return str.replace(/[&<>'\"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }
  </script>
</body>
</html>
