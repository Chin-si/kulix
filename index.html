<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.G.Y TENSION</title> 
   <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () {
      (window.vaq = window.vaq || []).push(arguments);
    };
  </script>

  <script
    defer
    src="/_vercel/insights/script.js">
  </script>
  
  <!-- CDN Dependencies -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #d946ef; }
  </style>
</head>
<body class="bg-neutral-950 text-white font-sans selection:bg-fuchsia-500 selection:text-white antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // ⚙️ SUPABASE CONFIGURATION
    // Replace with your real Supabase URL & Key when ready!
    // ==========================================
    const SUPABASE_URL = 'https://jfzypvnlbrmpbuxmlhgp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_uT8ky5GdL-0LQ3O5cJlJZw_EfP6IHCM';
    
    // Safe initialization wrapper
    let supabase = null;
    try {
      if (SUPABASE_URL.includes('YOUR_PROJECT_REF') === false) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.warn("Supabase client running in offline demo mode.");
    }

    // Pure React Inline SVG Icons (Prevents Lucide script crash)
    const Icons = {
      Radio: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 18.5a6.5 6.5 0 100-13 6.5 6.5 0 000 13z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>,
      Upload: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>,
      Disc: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" strokeWidth="2"/><circle cx="12" cy="12" r="3" strokeWidth="2"/></svg>,
      Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>,
      Message: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>,
      User: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>,
      Play: () => <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>,
      Pause: () => <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>,
      Heart: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>,
      Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>,
      Send: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>,
      Music: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
    };

    function MGYTensionNetwork() {
      const [activeTab, setActiveTab] = useState('feed');
      const [tracks, setTracks] = useState([]);
      const [comments, setComments] = useState([]);
      const [messages, setMessages] = useState([]);
      
      const [currentTrack, setCurrentTrack] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isUploading, setIsUploading] = useState(false);
      
      const [artistName, setArtistName] = useState('Artist_' + Math.floor(Math.random() * 8999 + 1000));
      const [searchQuery, setSearchQuery] = useState('');
      const [activeChatUser, setActiveChatUser] = useState('VIBE MASTER M.G.Y');
      const [newMessage, setNewMessage] = useState('');

      const audioRef = useRef(null);

      // Demo fallback tracks
      const INITIAL_DEMO_TRACKS = [
        {
          id: 'demo-1',
          title: 'HYPERDRIVE TENSION',
          artist: 'VIBE MASTER M.G.Y',
          file_url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
          format: 'MP3',
          likes: 42
        },
        {
          id: 'demo-2',
          title: 'NEON WAVE DISRUPTION',
          artist: 'PRODUCER_99',
          file_url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',
          format: 'WAV',
          likes: 18
        }
      ];

      useEffect(() => {
        if (supabase) {
          fetchTracks();
          fetchComments();
          fetchMessages();

          const channel = supabase
            .channel('public-network')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'tracks' }, () => fetchTracks())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, () => fetchComments())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => fetchMessages())
            .subscribe();

          return () => { supabase.removeChannel(channel); };
        } else {
          setTracks(INITIAL_DEMO_TRACKS);
        }
      }, []);

      const fetchTracks = async () => {
        const { data, error } = await supabase.from('tracks').select('*').order('created_at', { ascending: false });
        if (!error && data) setTracks(data);
      };

      const fetchComments = async () => {
        const { data, error } = await supabase.from('comments').select('*').order('created_at', { ascending: true });
        if (!error && data) setComments(data);
      };

      const fetchMessages = async () => {
        const { data, error } = await supabase.from('messages').select('*').order('created_at', { ascending: true });
        if (!error && data) setMessages(data);
      };

      const togglePlay = (track) => {
        if (currentTrack?.id === track.id) {
          if (isPlaying) {
            audioRef.current.pause();
            setIsPlaying(false);
          } else {
            audioRef.current.play();
            setIsPlaying(true);
          }
        } else {
          setCurrentTrack(track);
          setIsPlaying(true);
          setTimeout(() => audioRef.current?.play(), 100);
        }
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const allowedExtensions = ['mp3', 'wav', 'm4a', 'aac', 'ogg', 'oga', 'flac'];
        const ext = file.name.split('.').pop().toLowerCase();

        if (!allowedExtensions.includes(ext)) {
          alert(`Unsupported format! Allowed: ${allowedExtensions.join(', ').toUpperCase()}`);
          return;
        }

        setIsUploading(true);

        try {
          if (supabase) {
            const fileName = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
            const { error: uploadError } = await supabase.storage.from('music').upload(fileName, file);
            if (uploadError) throw uploadError;

            const { data: publicUrlData } = supabase.storage.from('music').getPublicUrl(fileName);

            const { error: dbError } = await supabase.from('tracks').insert([
              {
                title: file.name.replace(/\.[^/.]+$/, ""),
                artist: artistName,
                file_url: publicUrlData.publicUrl,
                format: ext.toUpperCase(),
                likes: 0
              }
            ]);
            if (dbError) throw dbError;
          } else {
            // Local preview mode
            const localTrack = {
              id: String(Date.now()),
              title: file.name.replace(/\.[^/.]+$/, ""),
              artist: artistName,
              file_url: URL.createObjectURL(file),
              format: ext.toUpperCase(),
              likes: 0
            };
            setTracks([localTrack, ...tracks]);
          }
          alert('🔥 Track uploaded successfully!');
        } catch (err) {
          alert('Upload Error: ' + err.message);
        } finally {
          setIsUploading(false);
        }
      };

      const handleLike = async (track) => {
        if (supabase) {
          await supabase.from('tracks').update({ likes: track.likes + 1 }).eq('id', track.id);
        } else {
          setTracks(tracks.map(t => t.id === track.id ? { ...t, likes: t.likes + 1 } : t));
        }
      };

      const handleAddComment = async (trackId, text) => {
        if (!text.trim()) return;
        if (supabase) {
          await supabase.from('comments').insert([{ track_id: trackId, user_name: artistName, text: text }]);
        } else {
          setComments([...comments, { id: Date.now(), track_id: trackId, user_name: artistName, text: text }]);
        }
      };

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!newMessage.trim()) return;

        if (supabase) {
          await supabase.from('messages').insert([{ sender: artistName, receiver: activeChatUser, text: newMessage }]);
        } else {
          setMessages([...messages, { id: Date.now(), sender: artistName, receiver: activeChatUser, text: newMessage }]);
        }
        setNewMessage('');
      };

      return (
        <div className="min-h-screen pb-32 relative overflow-x-hidden">
          
          <div className="fixed inset-0 pointer-events-none z-0">
            <div className="absolute -top-40 -left-40 w-96 h-96 bg-fuchsia-600/20 rounded-full blur-3xl animate-pulse"></div>
            <div className="absolute top-1/2 -right-40 w-96 h-96 bg-cyan-500/20 rounded-full blur-3xl animate-pulse"></div>
          </div>

          <header className="sticky top-0 z-40 bg-neutral-950/80 backdrop-blur-xl border-b border-neutral-800/80 px-4 md:px-8 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="p-2.5 bg-gradient-to-tr from-fuchsia-600 via-violet-600 to-cyan-400 rounded-2xl shadow-lg shadow-fuchsia-500/30">
                <Icons.Radio />
              </div>
              <div>
                <h1 className="font-black text-xl tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-fuchsia-400 via-pink-400 to-cyan-400">
                  M.G.Y TENSION
                </h1>
                <p className="text-[10px] text-neutral-400 tracking-widest font-mono uppercase">LIVE ARTIST STREAM & NETWORK</p>
              </div>
            </div>

            <label className="cursor-pointer flex items-center gap-2 bg-gradient-to-r from-fuchsia-600 to-pink-600 hover:from-fuchsia-500 hover:to-pink-500 text-white font-bold text-xs md:text-sm px-4 py-2.5 rounded-full shadow-lg shadow-fuchsia-600/30 transition hover:scale-105 active:scale-95">
              <Icons.Upload />
              <span>{isUploading ? 'UPLOADING...' : 'DROP AUDIO TRACK'}</span>
              <input 
                type="file" 
                accept=".mp3,.wav,.m4a,.aac,.ogg,.oga,.flac" 
                onChange={handleFileUpload} 
                className="hidden" 
                disabled={isUploading}
              />
            </label>
          </header>

          <div className="relative z-10 max-w-7xl mx-auto px-4 md:px-8 pt-6 grid grid-cols-1 md:grid-cols-12 gap-8">
            
            <aside className="md:col-span-3 flex md:flex-col gap-2 overflow-x-auto pb-2 md:pb-0 scrollbar-none">
              {[
                { id: 'feed', label: 'Music Stream', icon: Icons.Disc },
                { id: 'search', label: 'Discover Artists', icon: Icons.Search },
                { id: 'messages', label: 'Live Chat Network', icon: Icons.Message },
                { id: 'profile', label: 'Artist Profile', icon: Icons.User }
              ].map(tab => {
                const TabIcon = tab.icon;
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex items-center gap-3 px-4 py-3.5 rounded-2xl font-bold text-sm transition-all whitespace-nowrap ${
                      isActive 
                        ? 'bg-gradient-to-r from-fuchsia-600/20 to-pink-600/10 border border-fuchsia-500/50 text-fuchsia-300 shadow-md' 
                        : 'bg-neutral-900/50 border border-neutral-800/50 text-neutral-400 hover:text-white hover:bg-neutral-800/50'
                    }`}
                  >
                    <TabIcon />
                    {tab.label}
                  </button>
                );
              })}
            </aside>

            <main className="md:col-span-9 space-y-6">
              
              {activeTab === 'feed' && (
                <div className="space-y-6">
                  <div className="relative overflow-hidden rounded-3xl bg-gradient-to-r from-fuchsia-900/60 via-purple-900/40 to-neutral-900 border border-fuchsia-500/30 p-6 md:p-8">
                    <div className="relative z-10 space-y-2">
                      <span className="inline-flex items-center gap-1.5 px-3 py-1 bg-fuchsia-500/20 border border-fuchsia-400/30 rounded-full text-fuchsia-300 text-xs font-bold uppercase tracking-wider">
                        ⚡ Upcoming Artist Releases
                      </span>
                      <h2 className="text-3xl md:text-5xl font-black tracking-tight text-white">
                        M.G.Y LIVE AUDIO NETWORK
                      </h2>
                    </div>
                  </div>

                  <div className="space-y-4">
                    {tracks.length === 0 ? (
                      <div className="text-center py-12 text-neutral-500 font-mono text-sm border border-neutral-800 rounded-3xl">
                        No audio tracks uploaded yet. Upload a track above!
                      </div>
                    ) : (
                      tracks.map(track => {
                        const isCurrent = currentTrack?.id === track.id;
                        const trackComments = comments.filter(c => c.track_id === track.id);

                        return (
                          <div 
                            key={track.id}
                            className={`group relative overflow-hidden rounded-2xl bg-neutral-900/60 border transition-all duration-300 p-4 md:p-5 flex flex-col md:flex-row gap-5 items-start md:items-center ${
                              isCurrent ? 'border-fuchsia-500 shadow-xl shadow-fuchsia-950/50 bg-neutral-900/90' : 'border-neutral-800 hover:border-neutral-700'
                            }`}
                          >
                            <div className="relative w-24 h-24 md:w-28 md:h-28 rounded-xl overflow-hidden flex-shrink-0 bg-neutral-800 flex items-center justify-center">
                              <Icons.Music />
                              <button 
                                onClick={() => togglePlay(track)}
                                className="absolute inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center opacity-90 transition-opacity"
                              >
                                {isCurrent && isPlaying ? <Icons.Pause /> : <Icons.Play />}
                              </button>
                            </div>

                            <div className="flex-1 space-y-2 w-full">
                              <div className="flex items-center justify-between gap-2">
                                <div>
                                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-neutral-800 border border-neutral-700 text-cyan-400 font-bold">
                                    {track.format}
                                  </span>
                                  <h3 className="font-extrabold text-lg md:text-xl text-white tracking-wide mt-1">
                                    {track.title}
                                  </h3>
                                  <p className="text-xs text-neutral-400 font-semibold">{track.artist}</p>
                                </div>

                                <a 
                                  href={track.file_url} 
                                  download
                                  target="_blank"
                                  rel="noreferrer"
                                  className="p-2.5 bg-neutral-800 hover:bg-neutral-700 rounded-xl text-neutral-300 hover:text-white transition"
                                >
                                  <Icons.Download />
                                </a>
                              </div>

                              <div className="flex items-center gap-1 h-6 py-1">
                                {[40,70,30,80,100,50,90,60,30,70,40,90,100,40,80,60,30].map((h, i) => (
                                  <div 
                                    key={i} 
                                    style={{ height: `${isCurrent && isPlaying ? h : 20}%` }}
                                    className={`flex-1 rounded-full transition-all duration-300 ${
                                      isCurrent && isPlaying ? 'bg-gradient-to-t from-fuchsia-500 to-cyan-400 animate-pulse' : 'bg-neutral-800'
                                    }`}
                                  />
                                ))}
                              </div>

                              <div className="flex items-center gap-4 pt-1">
                                <button 
                                  onClick={() => handleLike(track)}
                                  className="flex items-center gap-1.5 text-xs font-bold text-neutral-400 hover:text-pink-500 transition"
                                >
                                  <Icons.Heart />
                                  {track.likes}
                                </button>

                                <div className="flex items-center gap-1.5 text-xs font-bold text-neutral-400">
                                  <Icons.Message />
                                  {trackComments.length} Comments
                                </div>
                              </div>

                              <div className="mt-3 pt-3 border-t border-neutral-800/80 space-y-2">
                                <div className="max-h-24 overflow-y-auto space-y-1.5 pr-2">
                                  {trackComments.map((c, idx) => (
                                    <div key={c.id || idx} className="text-xs bg-neutral-950/50 p-2 rounded-lg border border-neutral-800/40">
                                      <span className="font-bold text-fuchsia-400 mr-2">{c.user_name}:</span>
                                      <span className="text-neutral-300">{c.text}</span>
                                    </div>
                                  ))}
                                </div>
                                
                                <input 
                                  type="text" 
                                  placeholder="Post a comment..."
                                  onKeyDown={(e) => {
                                    if (e.key === 'Enter') {
                                      handleAddComment(track.id, e.target.value);
                                      e.target.value = '';
                                    }
                                  }}
                                  className="w-full bg-neutral-950 border border-neutral-800 text-xs text-white rounded-xl px-3 py-2 focus:outline-none focus:border-fuchsia-500 transition"
                                />
                              </div>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              )}

              {activeTab === 'search' && (
                <div className="space-y-6">
                  <input 
                    type="text" 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search tracks or artists..."
                    className="w-full bg-neutral-900 border border-neutral-800 rounded-2xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-fuchsia-500"
                  />

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {tracks
                      .filter(t => t.title.toLowerCase().includes(searchQuery.toLowerCase()) || t.artist.toLowerCase().includes(searchQuery.toLowerCase()))
                      .map(track => (
                        <div key={track.id} className="bg-neutral-900/60 border border-neutral-800 p-4 rounded-2xl flex items-center justify-between">
                          <div>
                            <h4 className="font-bold text-sm text-white">{track.title}</h4>
                            <p className="text-xs text-neutral-400">{track.artist}</p>
                          </div>
                          <button 
                            onClick={() => togglePlay(track)}
                            className="p-3 bg-fuchsia-600 rounded-xl text-white hover:bg-fuchsia-500 transition"
                          >
                            <Icons.Play />
                          </button>
                        </div>
                      ))}
                  </div>
                </div>
              )}

              {activeTab === 'messages' && (
                <div className="grid grid-cols-1 md:grid-cols-3 bg-neutral-900/50 border border-neutral-800 rounded-3xl overflow-hidden min-h-[500px]">
                  <div className="border-r border-neutral-800 p-4 space-y-2">
                    <h3 className="text-xs font-bold text-neutral-400 uppercase tracking-wider mb-4">Direct Live Connect</h3>
                    {['VIBE MASTER M.G.Y', 'CyberSonic', 'PRODUCER_99'].map((name, idx) => (
                      <button 
                        key={idx}
                        onClick={() => setActiveChatUser(name)}
                        className={`w-full p-3 rounded-2xl text-left flex items-center gap-3 transition ${
                          activeChatUser === name ? 'bg-fuchsia-600/20 border border-fuchsia-500/50' : 'hover:bg-neutral-800/50'
                        }`}
                      >
                        <div className="w-8 h-8 bg-neutral-800 rounded-full flex items-center justify-center font-bold text-fuchsia-400 text-xs">
                          {name[0]}
                        </div>
                        <span className="text-xs font-bold text-white">{name}</span>
                      </button>
                    ))}
                  </div>

                  <div className="md:col-span-2 flex flex-col justify-between p-4 bg-neutral-950/40">
                    <div className="border-b border-neutral-800 pb-3 font-bold text-sm text-fuchsia-300 flex items-center justify-between">
                      <span>Chatting with {activeChatUser}</span>
                    </div>

                    <div className="flex-1 my-4 space-y-3 overflow-y-auto max-h-[350px] pr-2">
                      {messages
                        .filter(m => (m.sender === artistName && m.receiver === activeChatUser) || (m.sender === activeChatUser && m.receiver === artistName))
                        .map((msg, idx) => (
                          <div key={msg.id || idx} className={`flex ${msg.sender === artistName ? 'justify-end' : 'justify-start'}`}>
                            <div className={`max-w-[75%] p-3 rounded-2xl text-xs ${
                              msg.sender === artistName ? 'bg-fuchsia-600 text-white rounded-br-none' : 'bg-neutral-800 text-neutral-200 rounded-bl-none'
                            }`}>
                              <div className="font-bold text-[9px] opacity-75 mb-0.5">{msg.sender}</div>
                              {msg.text}
                            </div>
                          </div>
                        ))}
                    </div>

                    <form onSubmit={handleSendMessage} className="flex gap-2">
                      <input 
                        type="text"
                        value={newMessage}
                        onChange={(e) => setNewMessage(e.target.value)}
                        placeholder="Type message..."
                        className="flex-1 bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-fuchsia-500"
                      />
                      <button type="submit" className="p-2.5 bg-fuchsia-600 hover:bg-fuchsia-500 rounded-xl text-white transition">
                        <Icons.Send />
                      </button>
                    </form>
                  </div>
                </div>
              )}

              {activeTab === 'profile' && (
                <div className="bg-neutral-900/40 border border-neutral-800 rounded-3xl p-6 md:p-8 space-y-6">
                  <div className="space-y-4 max-w-md">
                    <h3 className="text-xl font-black text-white">Artist Profile Settings</h3>
                    <div>
                      <label className="text-xs text-neutral-400 font-bold block mb-1">Your Public Display Handle</label>
                      <input 
                        type="text" 
                        value={artistName}
                        onChange={(e) => setArtistName(e.target.value)}
                        className="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-fuchsia-500"
                      />
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>

          {currentTrack && (
            <div className="fixed bottom-0 left-0 right-0 z-50 bg-neutral-950/90 backdrop-blur-2xl border-t border-fuchsia-500/30 px-4 md:px-8 py-3">
              <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
                <div className="flex items-center gap-3 w-1/3">
                  <div className="w-10 h-10 bg-neutral-800 rounded flex items-center justify-center">
                    <Icons.Music />
                  </div>
                  <div className="truncate">
                    <h5 className="font-bold text-xs text-white truncate">{currentTrack.title}</h5>
                    <p className="text-[10px] text-neutral-400 truncate">{currentTrack.artist}</p>
                  </div>
                </div>

                <button 
                  onClick={() => togglePlay(currentTrack)}
                  className="p-3 bg-gradient-to-r from-fuchsia-600 to-pink-600 rounded-full text-white shadow-lg shadow-fuchsia-600/40 hover:scale-105 transition"
                >
                  {isPlaying ? <Icons.Pause /> : <Icons.Play />}
                </button>

                <div className="w-1/3 text-right">
                  <span className="text-[10px] font-mono bg-neutral-800 border border-neutral-700 px-2 py-0.5 rounded text-cyan-400">
                    {currentTrack.format}
                  </span>
                </div>
              </div>

              <audio 
                ref={audioRef} 
                src={currentTrack.file_url} 
                onEnded={() => setIsPlaying(false)}
              />
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MGYTensionNetwork />);
  </script>
</body>
</html>
